services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_assistant
      POSTGRES_USER: career_assistant
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "5432:5432"
    volumes:
      - career_assistant_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  career_assistant_postgres:
